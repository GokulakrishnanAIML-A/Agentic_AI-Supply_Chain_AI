name: CI Pipeline

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Invariants
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supplychain
          POSTGRES_PASSWORD: supplychain
          POSTGRES_DB: supplychain
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: postgresql+psycopg2://supplychain:supplychain@localhost:5432/supplychain
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
        run: |
          pytest backend/tests/ --cov=backend/app --cov-report=term-missing -v

      - name: Run System Verification Smoke Test
        run: |
          python verify_system.py

      - name: Run Intent & Forecast Benchmarks
        run: |
          python scripts/eval_intent.py
          python scripts/eval_forecast.py
          python scripts/eval_solver.py --seed 42 --n 20
          python scripts/eval_ablation.py --seed 42
          python scripts/build_report.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build
